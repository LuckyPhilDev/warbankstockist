name: Dry-run package

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package only, no uploads
        run: |
          bash <(curl -s https://raw.githubusercontent.com/BigWigsMods/packager/master/release.sh) -d

      - name: Attach zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/*.zip
